[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-factory"
version = "1.0.0"
description = "AI-powered YouTube video creation tool"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "Pillow>=10.0.0",
    "yt-dlp>=2024.0.0",
    "pydub>=0.25.0",
    "PyJWT>=2.8.0",
    "httpx>=0.27.0",
]

[project.scripts]
youtube-factory = "server:main"

[tool.setuptools.packages.find]
include = ["steps*"]

[tool.setuptools.package-data]
"*" = ["static/**/*"]
